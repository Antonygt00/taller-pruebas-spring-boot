<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de citas</title>
    <style>
        :root {
            --ink: #1a2b33;
            --accent: #0f6b5c;
            --mist: #e8f2ef;
            --card: #ffffff;
            --warn: #9b2c2c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 10% 10%, #d7efe8 0%, transparent 40%),
                radial-gradient(circle at 90% 0%, #cfe0f5 0%, transparent 35%),
                linear-gradient(160deg, #f7fbfa, #eef4f8 55%, #e7f0ec);
            display: grid;
            place-items: center;
            padding: 1.5rem;
        }
        main {
            width: min(420px, 100%);
            background: var(--card);
            border: 1px solid #d5e4df;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 18px 40px rgba(26, 43, 51, 0.08);
        }
        h1 {
            margin: 0 0 0.35rem;
            font-size: 1.45rem;
        }
        p {
            margin: 0 0 1.2rem;
            color: #4b6168;
            font-size: 0.95rem;
        }
        label {
            display: block;
            margin: 0.75rem 0 0.3rem;
            font-size: 0.85rem;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border: 1px solid #c9d8d3;
            border-radius: 10px;
            font-size: 1rem;
            background: var(--mist);
        }
        button {
            margin-top: 1.1rem;
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 0.85rem 1rem;
            background: var(--accent);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.05); }
        #mensaje {
            min-height: 1.4rem;
            margin-top: 1rem;
            font-weight: 600;
        }
        #mensaje.error { color: var(--warn); }
        #mensaje.ok { color: var(--accent); }
    </style>
</head>
<body>
<main>
    <h1>Reserva de citas</h1>
    <p>Agenda un horario con el profesional disponible.</p>
    <label for="profesional">Profesional</label>
    <input id="profesional" placeholder="Profesional">
    <label for="fechaHora">Fecha y hora</label>
    <input id="fechaHora" type="datetime-local">
    <label for="pacienteId">Documento del paciente</label>
    <input id="pacienteId" placeholder="Documento del paciente">
    <button id="btnReservar" type="button">Reservar</button>
    <div id="mensaje"></div>
</main>
<script>
    document.getElementById('btnReservar').addEventListener('click', async () => {
        const mensaje = document.getElementById('mensaje');
        mensaje.className = '';
        mensaje.textContent = '';

        const profesional = document.getElementById('profesional').value;
        const fechaHora = document.getElementById('fechaHora').value;
        const pacienteId = document.getElementById('pacienteId').value;
        const body = {
            profesional,
            fechaHora: fechaHora ? fechaHora + ':00' : null,
            pacienteId
        };

        try {
            const resp = await fetch('/api/citas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (resp.status === 201) {
                mensaje.className = 'ok';
                mensaje.textContent = 'Cita reservada';
                return;
            }

            if (resp.status === 409) {
                mensaje.className = 'error';
                mensaje.textContent = 'Horario no disponible';
                return;
            }

            mensaje.className = 'error';
            mensaje.textContent = 'Datos inválidos';
        } catch (e) {
            mensaje.className = 'error';
            mensaje.textContent = 'Error de conexión';
        }
    });
</script>
</body>
</html>
